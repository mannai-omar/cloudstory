# Local development: the full app on your machine, no cloud needed.
#   cp .env.example .env && docker compose up --build
#   Site:    http://localhost:3000
#   API:     http://localhost:8080/api/status
#   Metrics: http://localhost:8081/actuator/prometheus

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cloudstory
      POSTGRES_USER: cloudstory
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cloudstory}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudstory -d cloudstory"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    environment:
      DB_URL: jdbc:postgresql://db:5432/cloudstory
      DB_USERNAME: cloudstory
      DB_PASSWORD: ${DB_PASSWORD:-cloudstory}
      APP_ENVIRONMENT: local
      DEPLOY_EVENT_TOKEN: ${DEPLOY_EVENT_TOKEN:-}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-}
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5

  web:
    build:
      context: ./web
      args:
        VITE_GITHUB_URL: ${GITHUB_URL:-https://github.com/}
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "3000:8080"
    depends_on:
      api:
        condition: service_started

volumes:
  db-data:
